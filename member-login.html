<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>FCA Member Login</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <section class="login-page">

        <div class="login-container">

            <h1>FCA MEMBER LOGIN</h1>

            <p>
                FedPoNaM Comrades Association
            </p>

            <p>
                Forged In Kaura, Destined for Greatness
            </p>


            <!-- LOGIN FORM -->

            <form id="memberLoginForm">

                <label for="memberEmail">
                    Email Address
                </label>

                <input
                    type="email"
                    id="memberEmail"
                    placeholder="Enter your email"
                    required
                >


                <label for="memberPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="memberPassword"
                    placeholder="Enter your password"
                    required
                >


                <button type="submit">
                    Login
                </button>

            </form>


            <p id="loginMessage"></p>


            <p>
                Don't have an account?
                <a href="membership.html">
                    Apply for Membership
                </a>
            </p>

        </div>

    </section>
